# Pinned so the volume names below don't change if the checkout
# directory is renamed. Volumes are prefixed with the project name.
name: tufteseid

services:
  tufteseid:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      # Runtime config injected into the SPA. Copy config.example.js to
      # config.js and edit for your deployment.
      - ./config.js:/var/www/config.js:ro
      # Optional: override the baked-in Caddyfile without rebuilding.
      # - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - wmscache
      - pocketbase

  # Backend for lokaliteter. Serves the SPA's /pb/* API (proxied by
  # Caddy) for user auth (OAuth via Google/GitHub/OIDC/…) and the
  # localities / finds / attachments collections. SQLite-backed; state
  # lives on the pbdata volume, schema is versioned in
  # ./pocketbase/pb_migrations. Only reachable from tufteseid over the
  # compose network — Caddy is the only public entrypoint. To reach the
  # PB admin UI directly during setup, temporarily add
  #   ports: ["127.0.0.1:8090:8090"]
  # here; normally it's at <site>/pb/_/.
  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - pbdata:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations:ro

  # Caching reverse proxy for every external WMS the app uses (Kartverket
  # theme + LiDAR, Riksantikvaren Kulturminner, matrikkel), plus an
  # uncached pass-through for the GeoNorge WFS. Caddy forwards
  # /wms/* and /wfs/* here; successful tile responses are cached on disk
  # (25 GB LRU). Not exposed on the host — only reachable from the
  # tufteseid container on the compose network.
  wmscache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/wms-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/wms-proxy-common.conf:/etc/nginx/wms-proxy-common.conf:ro
      - wmscache:/var/cache/nginx/wms

  # If you want Caddy to terminate TLS itself instead of sitting behind
  # another reverse proxy, change the ":3000" line in Caddyfile to your
  # hostname (e.g. "maps.example.com") and expose 80/443 here instead of
  # 3030. Caddy will provision Let's Encrypt certs automatically — but
  # add a volume for them (`- caddydata:/data` on the tufteseid service,
  # plus a `caddydata:` entry below), or every container recreate asks
  # Let's Encrypt for fresh certs and eventually hits their rate limit.

volumes:
  wmscache:
  pbdata:
