name: tufteseid

services:
  tufteseid:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      # Caddy routes Casdoor on the Host header and gates framing of its login
      # page on the app's origin.
      - CASDOOR_HOST=${CASDOOR_HOST:?set CASDOOR_HOST in .env}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    volumes:
      - ./config.js:/var/www/config.js:ro
      # First run: sudo mkdir -p /site/tufteseid/data/{logs,stats}
      - /site/tufteseid/data/logs:/var/log/caddy
      # Outside /var/www: under it the SPA's file_server would serve the
      # report with the app's CSP, which blocks GoAccess's inline script.
      - /site/tufteseid/data/stats:/srv/stats:ro
    depends_on:
      - wmscache
      - mapproxy
      - pocketbase
      - cvat-tiles
      - rendersvc
      - casdoor
      - remark42

  cvat-tiles:
    build: ./cvat-tiles
    restart: unless-stopped
    volumes:
      - /site/tufteseid/data/cvat:/store:ro

  mapproxy:
    image: ghcr.io/mapproxy/mapproxy/mapproxy:7.0.0-alpine-nginx
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./mapproxy/mapproxy.yaml:/mapproxy/config/mapproxy.yaml:ro
      - ./mapproxy/seed.yaml:/mapproxy/config/seed.yaml:ro
      # Must be writable by uid 100 gid 101 (the image's mapproxy user) or
      # uwsgi exits at import and every /cache/… answers 502.
      - /site/tufteseid/data/mapproxy:/mapproxy/config/cache_data
    depends_on:
      - nib-proxy

  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - pbdata:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations:ro

  # Server-side renders. Holds no credentials: every PocketBase call carries the
  # requesting reader's own token, so the collection rules decide what a job may
  # touch. Capped so a render cannot starve Caddy or PocketBase.
  rendersvc:
    build:
      context: .
      dockerfile: rendersvc/Dockerfile
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      # The origin printed in the provenance band burnt into a loop. Set it to
      # the address readers visit: a spot's short link is composed here, out of
      # the record, rather than taken from the request. Unset, a loop carries no
      # link.
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
    depends_on:
      - pocketbase

  wmscache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "4"
    volumes:
      - ./nginx/wms-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/wms-proxy-common.conf:/etc/nginx/wms-proxy-common.conf:ro
      - wmscache:/var/cache/nginx/wms
    depends_on:
      - nib-proxy

  # NiB tokens are bound to the minting IP and referer, so they are minted and
  # used server-side only. Reachable from wmscache and mapproxy, not the host.
  nib-proxy:
    build: ./nib-proxy
    restart: unless-stopped

  # The identity provider, with PocketBase and remark42 as its two OAuth2
  # clients. On a hostname of its own, not a subpath (docs/identity.md).
  casdoor:
    # No `v` prefix on Casdoor's tags, unlike remark42's below.
    image: casbin/casdoor:3.119.0
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    # No entrypoint override: `/server` creates the tables itself, and the
    # `--createDatabase=true` the docs suggest is MySQL-only DDL that panics
    # on sqlite.
    environment:
      # Each overrides the app.conf key of the same name, hence the un-shouty
      # names.
      - driverName=sqlite
      # No `file:` scheme — modernc.org/sqlite takes the prefix as part of the
      # path. The pragmas keep Casdoor off "database is locked"
      # (docs/identity.md).
      - "dataSourceName=/data/casdoor.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(10000)&_txlock=immediate"
      - runmode=prod
      - httpport=8000
      # OIDC discovery composes every endpoint from this, so it is the public
      # address. https is fixed here: an identity provider on http is not one.
      - origin=https://${CASDOOR_HOST:-}
    volumes:
      # Must be writable by uid 1000 gid 1000 (the image's casdoor user) or the
      # first write fails and the container restarts forever.
      - /site/tufteseid/data/casdoor:/data

  # Comment threads on public spots, with an identity store of its own
  # federated to Casdoor. v1.16.0 is the floor — below it the AUTH_CUSTOM_*
  # block is read by nothing (docs/discussion-and-votes.md).
  remark42:
    image: ghcr.io/umputun/remark42:v1.17.1
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      # Cookies, CORS and the OAuth callback are composed from this, so it
      # must match the public address exactly, subpath included.
      - REMARK_URL=${PUBLIC_ORIGIN:-}/remark42
      - SITE=tufteseid
      - SECRET=${REMARK42_SECRET:?set REMARK42_SECRET in .env}
      - ADMIN_SHARED_ID=${REMARK42_ADMIN_ID:-}
      # Basic auth on the public /remark42/api/v1/admin/* endpoints. Blank
      # disables it; set it only for the length of a backup or a remap.
      - ADMIN_PASSWD=${REMARK42_ADMIN_PASSWD:-}
      - ALLOWED_HOSTS='self'
      - AUTH_SAME_SITE=strict
      - EMOJI=true
      # The last path segment of the callback URL. Must match
      # ^[a-z0-9][a-z0-9_-]*$ and no built-in provider's name.
      - AUTH_CUSTOM_NAME=tufteseid
      - AUTH_CUSTOM_CID=${REMARK42_OIDC_CID:?set REMARK42_OIDC_CID in .env}
      - AUTH_CUSTOM_CSEC=${REMARK42_OIDC_CSEC:?set REMARK42_OIDC_CSEC in .env}
      # Authorize is front-channel, hence the public address and no `/api`;
      # the other two are back-channel and stay off the host's NAT loopback.
      # `silentSignin` suppresses Casdoor's "Continue with …" panel, which is
      # what lets the app run the trip in a hidden frame (src/api/remark42.ts).
      - AUTH_CUSTOM_AUTH_URL=https://${CASDOOR_HOST:-}/login/oauth/authorize?silentSignin=1
      - AUTH_CUSTOM_TOKEN_URL=http://casdoor:8000/api/login/oauth/access_token
      - AUTH_CUSTOM_INFO_URL=http://casdoor:8000/api/userinfo
      - AUTH_CUSTOM_SCOPES=openid,profile,email
    volumes:
      - /site/tufteseid/data/remark42:/srv/var
    depends_on:
      - casdoor

volumes:
  wmscache:
  pbdata:
