name: tufteseid

services:
  tufteseid:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./config.js:/var/www/config.js:ro
      # First run: sudo mkdir -p /site/tufteseid/data/{logs,stats}
      - /site/tufteseid/data/logs:/var/log/caddy
      # Outside /var/www: under it the SPA's file_server would serve the
      # report with the app's CSP, which blocks GoAccess's inline script.
      - /site/tufteseid/data/stats:/srv/stats:ro
    depends_on:
      - wmscache
      - mapproxy
      - pocketbase
      - cvat-tiles
      - rendersvc
      - casdoor
      - remark42

  cvat-tiles:
    build: ./cvat-tiles
    restart: unless-stopped
    volumes:
      - /site/tufteseid/data/cvat:/store:ro

  mapproxy:
    image: ghcr.io/mapproxy/mapproxy/mapproxy:7.0.0-alpine-nginx
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./mapproxy/mapproxy.yaml:/mapproxy/config/mapproxy.yaml:ro
      - ./mapproxy/seed.yaml:/mapproxy/config/seed.yaml:ro
      # Must be writable by uid 100 gid 101 (the image's mapproxy user) or
      # uwsgi exits at import and every /cache/… answers 502.
      - /site/tufteseid/data/mapproxy:/mapproxy/config/cache_data
    depends_on:
      - nib-proxy

  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - pbdata:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations:ro

  # Server-side renders. Holds no credentials: every PocketBase call carries the
  # requesting reader's own token, so the collection rules decide what a job may
  # touch. Capped so a render cannot starve Caddy or PocketBase.
  rendersvc:
    build:
      context: .
      dockerfile: rendersvc/Dockerfile
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      # The origin printed in the provenance band burnt into a loop. Set it to
      # the address readers visit: a spot's short link is composed here, out of
      # the record, rather than taken from the request. Unset, a loop carries no
      # link.
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
    depends_on:
      - pocketbase

  wmscache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "4"
    volumes:
      - ./nginx/wms-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/wms-proxy-common.conf:/etc/nginx/wms-proxy-common.conf:ro
      - wmscache:/var/cache/nginx/wms
    depends_on:
      - nib-proxy

  # NiB tokens are bound to the minting IP and referer, so they are minted and
  # used server-side only. Reachable from wmscache and mapproxy, not the host.
  nib-proxy:
    build: ./nib-proxy
    restart: unless-stopped

  # The reader's account lives here, not in PocketBase: two services need the
  # same identity and only an OIDC provider can give it to both. PocketBase is
  # a client of this (admin UI → users → OAuth2 → OIDC), remark42 another.
  #
  # Served under /id. Casdoor's admin console is a React SPA that assumes it
  # owns the root, so if it comes up blank behind the subpath the fallback is a
  # subdomain — `origin` and every registered callback move with it, nothing
  # else does.
  casdoor:
    # No `v` prefix on Casdoor's tags, unlike remark42's below.
    image: casbin/casdoor:3.119.0
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    # --createDatabase is a no-op once the schema is there, so it can stay.
    entrypoint: /bin/sh -c './server --createDatabase=true'
    environment:
      # Every app.conf key can be overridden by an env var of the same name,
      # and the env var wins. Hence the un-shouty names.
      - driverName=sqlite
      # No `file:` scheme — modernc.org/sqlite takes the prefix as part of the
      # path and silently creates a file called `file:`.
      - dataSourceName=/data/casdoor.db?cache=shared
      - runmode=prod
      - httpport=8000
      # OIDC discovery composes every endpoint from this, so it must be the
      # public address including the subpath.
      - origin=${PUBLIC_ORIGIN:-}/id
    volumes:
      # Must be writable by uid 1000 gid 1000 (the image's casdoor user) or the
      # first write fails and the container restarts forever.
      - /site/tufteseid/data/casdoor:/data

  # Comment threads on public spots. Keeps its own identity store — it cannot
  # read PocketBase's — federated to Casdoor so the reader signs in once.
  # Exactly one custom OAuth2 provider is supported, and a missing AUTH_CUSTOM_*
  # var is a startup failure rather than a disabled provider.
  remark42:
    image: ghcr.io/umputun/remark42:v1.14.0
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      # Cookies, CORS and the OAuth callback are all composed from this, so it
      # must match the public address exactly, subpath included.
      - REMARK_URL=${PUBLIC_ORIGIN:-}/remark42
      - SITE=tufteseid
      - SECRET=${REMARK42_SECRET:?set REMARK42_SECRET in .env}
      - ADMIN_SHARED_ID=${REMARK42_ADMIN_ID:-}
      # Unlocks `backup`, `restore` and `remap` — the last being the only way
      # back if the public origin ever moves, since threads are keyed by the
      # spot's share URL. Blank disables it, which is the default: it is HTTP
      # basic auth over the same public /remark42/api/v1/admin/* the widget's
      # own moderation uses, so a set password is a second, guessable way in.
      # Set it for the length of a migration and blank it again after.
      - ADMIN_PASSWD=${REMARK42_ADMIN_PASSWD:-}
      - ALLOWED_HOSTS='self'
      - AUTH_SAME_SITE=strict
      - EMOJI=true
      # Must match ^[a-z0-9][a-z0-9_-]*$ and collide with no built-in provider
      # name; it is the last path segment of the callback URL.
      - AUTH_CUSTOM_NAME=tufteseid
      - AUTH_CUSTOM_CID=${REMARK42_OIDC_CID:?set REMARK42_OIDC_CID in .env}
      - AUTH_CUSTOM_CSEC=${REMARK42_OIDC_CSEC:?set REMARK42_OIDC_CSEC in .env}
      - AUTH_CUSTOM_AUTH_URL=${PUBLIC_ORIGIN:-}/id/login/oauth/authorize
      - AUTH_CUSTOM_TOKEN_URL=${PUBLIC_ORIGIN:-}/id/api/login/oauth/access_token
      - AUTH_CUSTOM_INFO_URL=${PUBLIC_ORIGIN:-}/id/api/userinfo
      - AUTH_CUSTOM_SCOPES=openid,profile,email
    volumes:
      - /site/tufteseid/data/remark42:/srv/var
    depends_on:
      - casdoor

volumes:
  wmscache:
  pbdata:
