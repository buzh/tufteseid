version: 2
updates:
   - package-ecosystem: "github-actions"
     directory: "/"
     schedule:
       interval: "weekly"
   - package-ecosystem: "npm"
     directory: "/"
     schedule:
       interval: "weekly"
     open-pull-requests-limit: 20
     ignore:
       # typescript-eslint 8.x (through 8.69.0) declares
       # peer typescript ">=4.8.4 <6.1.0", so a TypeScript 7 bump makes
       # `npm ci` fail with ERESOLVE and the docker build never starts.
       # TS 7 is the native port, not a routine major. Drop this entry
       # once typescript-eslint ships TypeScript 7 support.
       - dependency-name: "typescript"
         update-types:
           - "version-update:semver-major"
