# Cache for external WMS endpoints fronted by wmscache. 25 GB LRU on disk;
# 100m keys_zone ≈ ~800k entries (roughly enough for 25 GB @ ~30 KB/tile).
# Shared across all upstreams — key includes the full URI so paths don't
# collide across hosts.
proxy_cache_path /var/cache/nginx/wms
    levels=1:2
    keys_zone=wms:100m
    max_size=25g
    inactive=180d
    use_temp_path=off;

# Skip caching only when we can definitively see the response is small
# (a 1–3 digit Content-Length). Real hillshade tiles are 5–50 KB.
#
# The empty-CL case (upstream sends Transfer-Encoding: chunked) used to
# skip too, but Kartverket's Envoy front sends chunked for BOTH the
# per-project WMS's real tiles and its blanks — so skipping on empty-CL
# prevented caching entirely. Cached "blank" tiles for genuinely
# uncovered BBOXes are fine; they *are* the correct answer.
map $upstream_http_content_length $skip_cache {
    default         0;
    "~^[0-9]{1,3}$" 1;
}

# max_fails=0 on every server is load-bearing, not tidying. Each group
# holds a single server, and the default (max_fails=1 fail_timeout=10s)
# means one upstream hiccup marks that sole server down — nginx then
# fails *every* request for the next 10s with an instant 502 and logs
# "no live upstreams". One shed tile at Kartverket's edge therefore
# blackholes a whole viewport. Disabling the fail counter leaves retry
# policy to proxy_next_upstream_tries instead (see the common include).
upstream geonorge_upstream {
    server wms.geonorge.no:443 max_fails=0;
    keepalive 32;
}

upstream geonorge_wfs_upstream {
    server wfs.geonorge.no:443 max_fails=0;
    keepalive 8;
}

upstream ra_upstream {
    server kart.ra.no:443 max_fails=0;
    keepalive 32;
}

upstream testapi_upstream {
    server testapi.norgeskart.no:443 max_fails=0;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Kartverket WMS namespace: /skwms1/wms.<layername> (main GeoNorge
    # theme WMSs), plus /skwms1/wms.hoyde-dtm... for the LiDAR hillshade
    # and per-project LiDAR DTMs. One location covers them all.
    location /skwms1/ {
        proxy_pass https://geonorge_upstream;
        proxy_set_header Host wms.geonorge.no;
        proxy_ssl_name wms.geonorge.no;
        include /etc/nginx/wms-proxy-common.conf;
    }

    # Kartverket WFS namespace via the /wfs-skwms1/ alias (see Caddyfile).
    # Deliberately NOT cached: it serves the "kjente kulturminner"
    # readout, where register data should be fresh, and the LiDAR
    # Prosjektavgrensning footprints, which are viewport-keyed and so
    # cache poorly. Kept out of the common include so the cache
    # directives never apply here.
    location /wfs-skwms1/ {
        rewrite ^/wfs-skwms1(/.*)$ /skwms1$1 break;
        proxy_pass https://geonorge_wfs_upstream;
        proxy_set_header Host wfs.geonorge.no;
        proxy_ssl_name wfs.geonorge.no;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        # Deliberately far below the WMS's 30s. This WFS answers a
        # Prosjektavgrensning BBOX query in ~0.25s when it is healthy,
        # but roughly one request in five hangs outright — measured
        # against wfs.geonorge.no directly, so it is the origin, not us —
        # and a hung one never recovers; it just burns the full timeout
        # and 504s. Failures arrive in runs of two or three, which is
        # what one sick backend behind their balancer looks like.
        # Cutting a hang at 8s and retrying turns a ~20% failure rate
        # into well under 1% while capping the worst case below what a
        # single 30s wait used to cost.
        proxy_read_timeout 8s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 25s;
    }

    # Riksantikvaren WMS: /wms/<layername>. Fronts the Kulturminner theme
    # layers (kulturminner2, kulturmiljoer, sefrak, freda_bygninger,
    # brukerminner). RA's origin is noticeably slower than Kartverket's;
    # caching helps a lot here.
    location /wms/ {
        proxy_pass https://ra_upstream;
        proxy_set_header Host kart.ra.no;
        proxy_ssl_name kart.ra.no;
        include /etc/nginx/wms-proxy-common.conf;
    }

    # testapi.norgeskart.no matrikkel WMS: /v1/matrikkel/wms. Used by the
    # cadastral property layers (addresses, buildings, borders).
    location /v1/ {
        proxy_pass https://testapi_upstream;
        proxy_set_header Host testapi.norgeskart.no;
        proxy_ssl_name testapi.norgeskart.no;
        include /etc/nginx/wms-proxy-common.conf;
    }
}
