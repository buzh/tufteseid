proxy_cache_path /var/cache/nginx/wms
    levels=1:2
    keys_zone=wms:100m
    max_size=25g
    inactive=180d
    use_temp_path=off;

# Under 300 bytes: the WMS returns its error bodies as a 200 with
# Content-Type: image/png. Real no-data tiles (479 bytes) must stay cacheable.
map $upstream_http_content_length $skip_cache {
    default           0;
    "~^[0-9]{1,2}$"   1;
    "~^[12][0-9]{2}$" 1;
}

# wms.geonorge.no sheds load with a 200 carrying application/vnd.ogc.se_xml,
# and answers chunked, so the length guard above never sees it. Must not widen
# to text/xml: that would take RA's GML GetFeatureInfo out of the cache too.
map $upstream_http_content_type $skip_cache_type {
    default    0;
    "~*se_xml" 1;
}

map $skip_cache$skip_cache_type $tile_cache_control {
    "00"    "public, max-age=604800, immutable";
    default "no-store";
}

# scripts/usage-report.sh reads the first five fields positionally.
# No $remote_addr on purpose: $request_uri holds a coordinate.
log_format wmscache '$time_iso8601 $status $upstream_cache_status '
                    '$request_method $request_uri '
                    'up=$upstream_addr rt=$request_time urt=$upstream_response_time '
                    'ct=$upstream_http_content_type bytes=$bytes_sent';

# The repeated peers are the retry budget: nginx caps tries at the peer count,
# so a one-server group makes proxy_next_upstream a silent no-op. max_fails=0
# stops one shed response marking every peer down at once.
upstream geonorge_upstream {
    server wms.geonorge.no:443 max_fails=0;
    server wms.geonorge.no:443 max_fails=0;
    server wms.geonorge.no:443 max_fails=0;
    keepalive 32;
    # Below nginx's 60s default: if the far end drops first, the next request
    # picks a dead socket out of the pool and 502s.
    keepalive_timeout 20s;
}

upstream geonorge_wfs_upstream {
    server wfs.geonorge.no:443 max_fails=0;
    server wfs.geonorge.no:443 max_fails=0;
    server wfs.geonorge.no:443 max_fails=0;
    keepalive 8;
    keepalive_timeout 20s;
}

upstream ra_upstream {
    server kart.ra.no:443 max_fails=0;
    server kart.ra.no:443 max_fails=0;
    server kart.ra.no:443 max_fails=0;
    keepalive 32;
    keepalive_timeout 20s;
}

upstream kms_upstream {
    server kms-api.kulturminnesok.no:443 max_fails=0;
    server kms-api.kulturminnesok.no:443 max_fails=0;
    server kms-api.kulturminnesok.no:443 max_fails=0;
    keepalive 8;
    keepalive_timeout 20s;
}

upstream hoydedata_upstream {
    server hoydedata.no:443 max_fails=0;
    server hoydedata.no:443 max_fails=0;
    server hoydedata.no:443 max_fails=0;
    keepalive 8;
    keepalive_timeout 20s;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log wmscache;

    location /skwms1/ {
        proxy_pass https://geonorge_upstream;
        proxy_set_header Host wms.geonorge.no;
        proxy_ssl_name wms.geonorge.no;
        include /etc/nginx/wms-proxy-common.conf;
    }

    # Spelled out rather than include-ing wms-proxy-common.conf: nginx rejects
    # a duplicated proxy_read_timeout/proxy_next_upstream and refuses to start,
    # taking every other upstream with it.
    location /wfs-skwms1/wfs.hoyde-hoydedata-metadata-prosjekt {
        rewrite ^/wfs-skwms1(/.*)$ /skwms1$1 break;
        proxy_pass https://geonorge_wfs_upstream;
        proxy_set_header Host wfs.geonorge.no;
        proxy_ssl_name wfs.geonorge.no;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_cache wms;
        proxy_cache_valid 200 180d;
        proxy_cache_valid 404 10m;
        proxy_cache_valid 400 403 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_no_cache $skip_cache $skip_cache_type;

        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control $tile_cache_control;

        # `timeout` is in the retry list only because this upstream does no
        # rendering: a slow answer is a sick backend, not work in progress.
        proxy_connect_timeout 10s;
        proxy_read_timeout 8s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 25s;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /wfs-skwms1/ {
        rewrite ^/wfs-skwms1(/.*)$ /skwms1$1 break;
        proxy_pass https://geonorge_wfs_upstream;
        proxy_set_header Host wfs.geonorge.no;
        proxy_ssl_name wfs.geonorge.no;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        # Roughly one request in five hangs at the origin and never recovers;
        # cutting it short and retrying is the only thing that works.
        proxy_read_timeout 8s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 25s;
    }

    location /wms/ {
        proxy_pass https://ra_upstream;
        proxy_set_header Host kart.ra.no;
        proxy_ssl_name kart.ra.no;
        include /etc/nginx/wms-proxy-common.conf;
    }

    location /kms-api/ {
        rewrite ^/kms-api(/.*)$ $1 break;
        proxy_pass https://kms_upstream;
        proxy_set_header Host kms-api.kulturminnesok.no;
        proxy_ssl_name kms-api.kulturminnesok.no;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_cache wms;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        proxy_cache_valid 400 403 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_no_cache $skip_cache $skip_cache_type;

        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control $tile_cache_control;

        proxy_connect_timeout 10s;
        proxy_read_timeout 8s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 25s;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /hoydedata-arcgis/ {
        rewrite ^/hoydedata-arcgis(/.*)$ /arcgis/rest/services$1 break;
        proxy_pass https://hoydedata_upstream;
        proxy_set_header Host hoydedata.no;
        proxy_ssl_name hoydedata.no;
        include /etc/nginx/wms-proxy-common.conf;
    }

    location /nib-wms/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        # `set` must precede the `rewrite ... break`: break halts the rewrite
        # module, leaving $nib_backend empty and "no host in upstream".
        set $nib_backend nib-proxy:8080;
        rewrite ^/nib-wms(/.*)$ $1 break;
        proxy_pass http://$nib_backend$uri$is_args$args;

        include /etc/nginx/wms-proxy-common.conf;
    }

    location /nib-arcgis/prosjekter/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nib_backend nib-proxy:8080;
        rewrite ^/nib-arcgis(/.*)$ /arcgis$1 break;
        proxy_pass http://$nib_backend$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache wms;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 10m;
        proxy_cache_valid 400 403 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_no_cache $skip_cache $skip_cache_type;

        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control $tile_cache_control;

        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /nib-arcgis/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nib_backend nib-proxy:8080;
        # The /arcgis marker selects the sidecar's REST base over its WMS one
        # (REST_PREFIX in nib-proxy/server.mjs).
        rewrite ^/nib-arcgis(/.*)$ /arcgis$1 break;
        proxy_pass http://$nib_backend$uri$is_args$args;

        include /etc/nginx/wms-proxy-common.conf;
    }
}
