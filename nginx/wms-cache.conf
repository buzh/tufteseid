# Cache for external WMS endpoints fronted by wmscache. 25 GB LRU on disk;
# 100m keys_zone ≈ ~800k entries (roughly enough for 25 GB @ ~30 KB/tile).
# Shared across all upstreams — key includes the full URI so paths don't
# collide across hosts.
proxy_cache_path /var/cache/nginx/wms
    levels=1:2
    keys_zone=wms:100m
    max_size=25g
    inactive=180d
    use_temp_path=off;

# Skip caching only for responses too small to be any kind of map at
# all (under 300 bytes). Real hillshade tiles are 5–50 KB.
#
# The empty-CL case (upstream sends Transfer-Encoding: chunked) used to
# skip too, but Kartverket's Envoy front sends chunked for BOTH the
# per-project WMS's real tiles and its blanks — so skipping on empty-CL
# prevented caching entirely.
#
# The threshold used to be 1000 bytes, which meant the no-data tile the
# DTM WMS returns outside coverage (479 bytes; 495 for one of its
# variants) was never cached — so every ocean and every Swedish tile
# went to the origin on every single visit, at a measured 0.3–6 s each.
# Zoomed out that is most of the screen, and those requests hold slots
# in OpenLayers' map-wide tile queue that the base map then cannot get.
# Caching them is correct: the no-data render is deterministic, verified
# byte-identical (same md5) across repeated requests for a fixed BBOX,
# so it *is* the right answer and will not change.
#
# 300 bytes still keeps out the ~100-byte JSON error body that the WMS
# returns — with a 200 and Content-Type: image/png — when asked for a
# style the layer does not publish. That one is a genuine mistake and
# must not be cached for 180 days.
map $upstream_http_content_length $skip_cache {
    default           0;
    "~^[0-9]{1,2}$"   1;
    "~^[12][0-9]{2}$" 1;
}

# Two non-obvious things about these blocks; both are load-bearing.
#
# The repeated `server` lines are not a copy-paste slip. nginx sets a
# request's retry budget to the number of peers in the group, and
# proxy_next_upstream_tries can only lower that number, never raise it
# — so a group with one server gets min(1, tries) = 1 attempt and
# proxy_next_upstream is silently a no-op no matter what it is set to.
# Listing the same host three times gives three real peers to fail over
# to, which is what makes the retry in the common include work at all.
#
# max_fails=0 disables the per-peer failure counter. The default
# (max_fails=1 fail_timeout=10s) would let one shed response mark a peer
# down for 10s; with every peer pointing at the same host, a short burst
# of upstream 502s would take all three out at once and nginx would then
# fail *every* request until the window expired, logging "no live
# upstreams". That turns one bad tile into a whole blank viewport.
upstream geonorge_upstream {
    server wms.geonorge.no:443 max_fails=0;
    server wms.geonorge.no:443 max_fails=0;
    server wms.geonorge.no:443 max_fails=0;
    keepalive 32;
    # Expire pooled connections well before the upstream does. nginx
    # defaults to holding an idle upstream connection for 60s; if the
    # far end drops it first, the next request picks a dead socket out
    # of the pool and fails instantly — a 502 in ~60ms, typically the
    # first tile after the map has sat idle for a while. Retrying does
    # not help when every peer draws from the same stale pool.
    keepalive_timeout 20s;
}

upstream geonorge_wfs_upstream {
    server wfs.geonorge.no:443 max_fails=0;
    server wfs.geonorge.no:443 max_fails=0;
    server wfs.geonorge.no:443 max_fails=0;
    keepalive 8;
    keepalive_timeout 20s;
}

upstream ra_upstream {
    server kart.ra.no:443 max_fails=0;
    server kart.ra.no:443 max_fails=0;
    server kart.ra.no:443 max_fails=0;
    keepalive 32;
    keepalive_timeout 20s;
}

upstream testapi_upstream {
    server testapi.norgeskart.no:443 max_fails=0;
    server testapi.norgeskart.no:443 max_fails=0;
    server testapi.norgeskart.no:443 max_fails=0;
    keepalive 32;
    keepalive_timeout 20s;
}

server {
    listen 80;
    server_name _;

    # Kartverket WMS namespace: /skwms1/wms.<layername> (main GeoNorge
    # theme WMSs), plus /skwms1/wms.hoyde-dtm... for the LiDAR hillshade
    # and per-project LiDAR DTMs. One location covers them all.
    location /skwms1/ {
        proxy_pass https://geonorge_upstream;
        proxy_set_header Host wms.geonorge.no;
        proxy_ssl_name wms.geonorge.no;
        include /etc/nginx/wms-proxy-common.conf;
    }

    # LiDAR project boundaries (Prosjektavgrensning), split out of the
    # WFS location below purely to cache them. The client asks for one
    # named project per request — never a BBOX, see the long note in
    # src/map/layers/config/backgroundLayers/lidarFootprints.ts — so the
    # request is keyed by project name, the answer is a completed
    # acquisition's outline and will not change, and the responses are
    # big (10–600 KB of uncompressed GeoJSON, occasionally more). That's
    # the ideal shape for the 180d LRU; the viewport-keyed queries this
    # replaced were not.
    #
    # nginx picks the longest matching prefix, so this wins over
    # /wfs-skwms1/ for exactly this one service.
    location /wfs-skwms1/wfs.hoyde-hoydedata-metadata-prosjekt {
        rewrite ^/wfs-skwms1(/.*)$ /skwms1$1 break;
        proxy_pass https://geonorge_wfs_upstream;
        proxy_set_header Host wfs.geonorge.no;
        proxy_ssl_name wfs.geonorge.no;
        include /etc/nginx/wms-proxy-common.conf;
        # Same hang-and-retry story as the uncached WFS location below:
        # roughly one request in five never answers, and 8s + retry beats
        # waiting out the common include's 30s. Safe here in a way it is
        # not for the WMS locations because this upstream does no
        # rendering — a slow response is a sick backend, not work in
        # progress.
        proxy_read_timeout 8s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Kartverket WFS namespace via the /wfs-skwms1/ alias (see Caddyfile).
    # Deliberately NOT cached: it serves the "kjente kulturminner"
    # readout, where register data should be fresh. Kept out of the
    # common include so the cache directives never apply here.
    location /wfs-skwms1/ {
        rewrite ^/wfs-skwms1(/.*)$ /skwms1$1 break;
        proxy_pass https://geonorge_wfs_upstream;
        proxy_set_header Host wfs.geonorge.no;
        proxy_ssl_name wfs.geonorge.no;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        # Deliberately far below the WMS's 30s. This WFS answers a
        # Prosjektavgrensning BBOX query in ~0.25s when it is healthy,
        # but roughly one request in five hangs outright — measured
        # against wfs.geonorge.no directly, so it is the origin, not us —
        # and a hung one never recovers; it just burns the full timeout
        # and 504s. Failures arrive in runs of two or three, which is
        # what one sick backend behind their balancer looks like.
        # Cutting a hang at 8s and retrying turns a ~20% failure rate
        # into well under 1% while capping the worst case below what a
        # single 30s wait used to cost.
        proxy_read_timeout 8s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 25s;
    }

    # Riksantikvaren WMS: /wms/<layername>. Fronts the Kulturminner theme
    # layers (kulturminner2, kulturmiljoer, sefrak, freda_bygninger,
    # brukerminner). RA's origin is noticeably slower than Kartverket's;
    # caching helps a lot here.
    location /wms/ {
        proxy_pass https://ra_upstream;
        proxy_set_header Host kart.ra.no;
        proxy_ssl_name kart.ra.no;
        include /etc/nginx/wms-proxy-common.conf;
    }

    # testapi.norgeskart.no matrikkel WMS: /v1/matrikkel/wms. Used by the
    # cadastral property layers (addresses, buildings, borders).
    location /v1/ {
        proxy_pass https://testapi_upstream;
        proxy_set_header Host testapi.norgeskart.no;
        proxy_ssl_name testapi.norgeskart.no;
        include /etc/nginx/wms-proxy-common.conf;
    }
}
