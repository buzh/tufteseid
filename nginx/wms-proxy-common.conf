proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Accept-Encoding "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

proxy_cache wms;
proxy_cache_valid 200 180d;
proxy_cache_valid 404 10m;
proxy_cache_valid 400 403 1m;
proxy_cache_lock on;
proxy_cache_lock_timeout 30s;
# The 5s default would break the lock mid-render; cold renders run 5-14s.
proxy_cache_lock_age 30s;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
# Do NOT add proxy_cache_bypass $skip_cache: it is evaluated at request time,
# when $upstream_http_content_length is still empty, so nothing would ever be
# served from cache.
proxy_no_cache $skip_cache $skip_cache_type;

# Vary is in the ignore list on purpose: hoydedata.no sends `Vary: Origin` on
# the float-DEM path, and one CORS-mode fetch would double its 4 MB entries.
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
proxy_hide_header Set-Cookie;
proxy_hide_header X-Powered-By;

# Hiding the originals is load-bearing: two Cache-Control headers and the
# browser takes the more restrictive one. No `always` on add_header either, so
# a 502 from a shed upstream cannot go out with a week of freshness.
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;
add_header Cache-Control $tile_cache_control;

proxy_connect_timeout 10s;
proxy_read_timeout 30s;
proxy_send_timeout 10s;

# `timeout` is deliberately not in the retry list: these upstreams render on
# the fly, so a read timeout is a render still running and retrying queues a
# second one for the same tile.
proxy_next_upstream error http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 45s;

add_header X-Cache-Status $upstream_cache_status always;
