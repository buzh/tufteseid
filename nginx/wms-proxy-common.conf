# Shared cache + proxy behavior for every upstream fronted by wmscache.
# Per-host bits — proxy_pass, Host header, proxy_ssl_name — are set at the
# location that includes this file, because they differ per upstream.

proxy_http_version 1.1;
proxy_set_header Connection "";
# Force upstream to send uncompressed. PNG bodies are already
# binary-compressed, so gzipping them on the wire saves ~nothing.
#
# This does NOT restore Content-Length, whatever it may once have looked like:
# measured on the wire, wms.geonorge.no answers chunked with no length either
# way. The guard that copes with that is $skip_cache_type in wms-cache.conf.
proxy_set_header Accept-Encoding "";
# Some CDN/WAF fronts inspect these — pass real client info through.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

proxy_cache wms;
proxy_cache_valid 200 180d;
# Negative caching. Without it only 200s are stored, so a 404 or a 400 is
# re-asked of the origin on every request — and the client retries each failed
# tile twice more (src/upstream/tileGuard.ts), making it 3 upstream requests
# per tile per level per session. The two that actually occur are NiB's
# ImageServer answering 400 to a malformed mosaicRule and a 404 anywhere on
# /hoydedata-arcgis/. Short lifetimes, because unlike a tile these can be
# fixed upstream. 5xx stays uncached: that is what use_stale is for.
proxy_cache_valid 404 10m;
proxy_cache_valid 400 403 1m;
proxy_cache_lock on;
proxy_cache_lock_timeout 30s;
# Without this the lock breaks after its 5s default and lets a second request
# through to the origin for the same cold key — and cold renders here were
# measured at 5-14s, so that fires on essentially every contended tile. The
# split view draws the same z/x/y from two Maps at once, which is exactly the
# case the lock exists for. Match the timeout: wait out the render instead.
proxy_cache_lock_age 30s;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_no_cache $skip_cache $skip_cache_type;
# Do NOT set proxy_cache_bypass $skip_cache — that directive is evaluated
# at request time, when $upstream_http_content_length is still empty, so
# the map would fire on every request and we'd never serve from cache.
# proxy_no_cache alone is enough to keep small responses out of the cache.

# Upstreams commonly send Set-Cookie (session cookies) which would block
# caching, and no Cache-Control. Ignore both. wms.geonorge.no does send
# Set-Cookie: JSESSIONID, so that one is load-bearing rather than defensive.
#
# Vary is here because nginx honours it by storing a secondary hash per
# variant. hoydedata.no sends `Vary: Origin` on the float-DEM path and RA and
# kms-api send `Vary: Accept-Encoding`. Neither splits the cache today —
# Accept-Encoding is pinned to "" above and same-origin GETs send no Origin —
# but a single CORS-mode fetch would double the 4 MB DEM entries, and a
# `Vary: *` from any of them would stop caching outright.
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires;
proxy_hide_header Set-Cookie;
proxy_hide_header X-Powered-By;

# Replace whatever freshness the upstream declared with ours — see
# $tile_cache_control in wms-cache.conf, and the long note above it for
# why. Hiding the originals matters: passing them through would leave two
# Cache-Control headers on the response and the browser takes the more
# restrictive, so RA's max-age=3600 would quietly win over ours.
#
# Deliberately no `always`. Without it add_header applies to successful
# statuses only, which is exactly the wanted scope — a 502 or 504 from a
# shed upstream must not go out with a week of freshness on it. The
# rate-limit exception is still covered because it arrives as a 200 and
# is caught by $skip_cache_type on its Content-Type — not by its length,
# which these upstreams do not send.
#
# The negative-cache statuses need no thought here either: 400, 403 and 404
# are outside add_header's default status list, so they go out with no
# freshness at all while still being held briefly on disk.
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;
add_header Cache-Control $tile_cache_control;

proxy_connect_timeout 10s;
proxy_read_timeout 30s;
proxy_send_timeout 10s;

# Kartverket's edge sheds load rather than queueing: under a burst of
# uncached tiles it answers a fraction of them with 502/504 while the
# on-the-fly renderer is busy. Those pass straight through to the
# browser as holes in the map. Retrying is cheap (a shed response comes
# back fast, and an immediate retry usually lands on a healthy backend)
# and these are all GETs, so nginx retries them without non_idempotent.
#
# `timeout` is deliberately NOT in that list, unlike the WFS location.
# These upstreams render on the fly and are strongly bimodal: a tile is
# either served from Kartverket's own cache in ~80ms or rendered cold,
# and cold renders were measured at 5-14s with a long tail. A read
# timeout here means a render that is still running, so retrying would
# abandon it and queue a second one for the same tile — tripling load on
# an origin that is already slow enough to have hit the timeout. Waiting
# out the 30s is both faster and kinder. Retry only where the upstream
# has actually answered or failed.
proxy_next_upstream error http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 45s;

add_header X-Cache-Status $upstream_cache_status always;
