<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- A burial mound as it reads in LiDAR hillshade: lit from the
         upper left, ringed by its ditch (lit on the opposite side). -->
    <defs>
        <linearGradient id="mound" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7ecd6" />
            <stop offset="0.5" stop-color="#a68f6d" />
            <stop offset="1" stop-color="#3b322a" />
        </linearGradient>
        <linearGradient id="ditch" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2a241e" />
            <stop offset="0.5" stop-color="#6d5c47" />
            <stop offset="1" stop-color="#c9b48f" />
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="12" fill="#221e1a" />
    <circle cx="32" cy="32" r="24" fill="url(#ditch)" />
    <circle cx="32" cy="32" r="17" fill="url(#mound)" />
</svg>
