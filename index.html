<!doctype html>
<!-- The attribute is what Mantine's stylesheet keys its dark variables off, and
     it is set statically because the alternative is Mantine's ColorSchemeScript,
     an inline <script> the CSP has no nonce to give it. Static also means no
     white flash: the page is dark before React mounts. Keep it in step with
     `defaultColorScheme` in src/mainApp.tsx. -->
<html lang="nb" data-mantine-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tufteseid</title>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mainApp.tsx"></script>
    <noscript>
      <h1>Tufteseid krever JavaScript for å kjøre</h1>
      <p>
        Skru det på i nettleserens instillinger for å kunne bruke denne
        nettsiden.
      </p>
    </noscript>
  </body>
</html>
