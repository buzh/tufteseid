services:
  tms:
    # Honoured only on /tiles/ requests; a /tms/ request hard-codes 'sw'.
    origin: 'nw'
    use_grid_names: true

grids:
  # Mirrors src/map/layers/wmsTileGrid.ts level for level: min_res 21664.0
  # halves to z16 = 0.331 m/px. Level z holds 2**(z-1) tiles per side.
  tufteseid25833:
    srs: 'EPSG:25833'
    bbox: [-2500000.0, 3500000.0, 3045984.0, 9045984.0]
    bbox_srs: 'EPSG:25833'
    origin: 'nw'
    min_res: 21664.0
    res_factor: 2
    tile_size: [512, 512]
    num_levels: 21

caches:
  lidar-dtm:
    grids: [tufteseid25833]
    sources: [lidar_dtm_wms]
    format: relief_png
    meta_size: [2, 2]
    meta_buffer: 0
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/lidar-dtm.mbtiles

  lidar-dom:
    grids: [tufteseid25833]
    sources: [lidar_dom_wms]
    format: relief_png
    meta_size: [2, 2]
    meta_buffer: 0
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/lidar-dom.mbtiles

  # Read-only second views of the same two MBTiles files: `sources: []` never
  # fetches, and answers a blank tile for ground the store does not hold.
  lidar-dtm-held:
    grids: [tufteseid25833]
    sources: []
    format: relief_png_held
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/lidar-dtm.mbtiles

  lidar-dom-held:
    grids: [tufteseid25833]
    sources: []
    format: relief_png_held
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/lidar-dom.mbtiles

  topo-ref:
    grids: [tufteseid25833]
    sources: [topo_ref_wms]
    format: overlay_png
    meta_size: [4, 4]
    meta_buffer: 80
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/topo-ref.mbtiles

  topo-ref-contours:
    grids: [tufteseid25833]
    sources: [topo_ref_contours_wms]
    format: overlay_png
    meta_size: [4, 4]
    meta_buffer: 80
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/topo-ref-contours.mbtiles

  amtskart:
    grids: [tufteseid25833]
    sources: [amtskart_wms]
    format: image/png
    meta_size: [4, 4]
    meta_buffer: 80
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/amtskart.mbtiles

  flyfoto:
    grids: [tufteseid25833]
    sources: [flyfoto_wms]
    format: image/jpeg
    meta_size: [2, 2]
    meta_buffer: 0
    cache:
      type: mbtiles
      filename: /mapproxy/config/cache_data/flyfoto.mbtiles

sources:
  # No `on_error` anywhere: a shed response must reach the browser as a 500 so
  # src/upstream/ trips, rather than being stored as a blank tile.
  lidar_dtm_wms:
    type: wms
    req:
      url: https://wms.geonorge.no/skwms1/wms.hoyde-dtm-nhm-topobathy-25833?
      layers: NHM_DTM_TOPOBATHY_25833:skyggerelieff
    supported_srs: ['EPSG:25833']
    concurrent_requests: 4
    http:
      client_timeout: 60
    # The service's declared EPSG:25833 bounds; same numbers as the layer
    # configs' `coverageExtent`.
    coverage:
      bbox: [-100275, 6399725, 1150255, 8000275]
      srs: 'EPSG:25833'

  lidar_dom_wms:
    type: wms
    req:
      url: https://wms.geonorge.no/skwms1/wms.hoyde-dom-nhm-25833?
      layers: NHM_DOM_25833:skyggerelieff
    supported_srs: ['EPSG:25833']
    concurrent_requests: 4
    http:
      client_timeout: 60
    coverage:
      bbox: [-100275, 6399725, 1150255, 8000275]
      srs: 'EPSG:25833'

  # kd_* groups stop around 1:25 000 where fkb_* take over; asking for both
  # families lets the server pick per scale.
  topo_ref_wms:
    type: wms
    req:
      url: https://wms.geonorge.no/skwms1/wms.topo?
      layers: kd_veger,kd_jernbane,kd_stedsnavn,fkb_samferdsel,fkb_presentasjonsdata
      transparent: true
    supported_srs: ['EPSG:25833']
    concurrent_requests: 4
    http:
      client_timeout: 60
    coverage:
      bbox: [-127998, 6377920, 1145510, 7976800]
      srs: 'EPSG:25833'

  # hoydekurver_1m and _5m come back empty from this service; not asked for.
  topo_ref_contours_wms:
    type: wms
    req:
      url: https://wms.geonorge.no/skwms1/wms.topo?
      layers: kd_veger,kd_jernbane,kd_stedsnavn,fkb_samferdsel,fkb_presentasjonsdata,kd_hoydekurver,fkb_hoydekurver
      transparent: true
    supported_srs: ['EPSG:25833']
    concurrent_requests: 4
    http:
      client_timeout: 60
    coverage:
      bbox: [-127998, 6377920, 1145510, 7976800]
      srs: 'EPSG:25833'

  amtskart_wms:
    type: wms
    req:
      url: https://wms.geonorge.no/skwms1/wms.historiskekart?
      layers: amt1
      transparent: true
    supported_srs: ['EPSG:25833']
    concurrent_requests: 4
    http:
      client_timeout: 60
    coverage:
      bbox: [-127998, 6377920, 1145510, 7976800]
      srs: 'EPSG:25833'

  # Via nib-proxy: NiB's anonymous token is bound to the IP and referer that
  # minted it, so it has to be injected server-side.
  flyfoto_wms:
    type: wms
    req:
      url: http://nib-proxy:8080/ortofoto?
      layers: ortofoto
      format: image/jpeg
    supported_srs: ['EPSG:25833']
    concurrent_requests: 4
    http:
      client_timeout: 60
    coverage:
      bbox: [-250025, 6299985, 1211155, 8985010]
      srs: 'EPSG:25833'

layers:
  # Each name is the `/cache/<name>/` segment the browser asks for.
  - name: lidar-dtm
    title: LiDAR DTM skyggerelieff, nasjonal mosaikk
    sources: [lidar-dtm]
  - name: lidar-dom
    title: LiDAR DOM skyggerelieff, nasjonal mosaikk
    sources: [lidar-dom]
  - name: lidar-dtm-held
    title: LiDAR DTM skyggerelieff, bare det mosaikklageret alt har
    sources: [lidar-dtm-held]
  - name: lidar-dom-held
    title: LiDAR DOM skyggerelieff, bare det mosaikklageret alt har
    sources: [lidar-dom-held]
  - name: topo-ref
    title: Referansedata fra wms.topo
    sources: [topo-ref]
  - name: topo-ref-contours
    title: Referansedata fra wms.topo, med høydekurver
    sources: [topo-ref-contours]
  - name: amtskart
    title: Amtskartserien, sammenhengende
    sources: [amtskart]
  - name: flyfoto
    title: Ortofoto, sammenhengende mosaikk
    sources: [flyfoto]

globals:
  cache:
    # Bind-mounted; MapProxy takes locks here at startup, so a directory not
    # writable by the image's mapproxy user (uid 100, gid 101) fails the
    # service outright.
    base_dir: /mapproxy/config/cache_data
  image:
    formats:
      relief_png:
        format: image/png
        mode: P
        colors: 256
        encoding_options:
          quantizer: fastoctree
      # `transparent` decides the blank tile synthesized for ground the store
      # does not hold; without it that blank is opaque white.
      relief_png_held:
        format: image/png
        mode: P
        colors: 256
        transparent: true
        encoding_options:
          quantizer: fastoctree
      overlay_png:
        format: image/png
        mode: P
        colors: 256
        transparent: true
        encoding_options:
          quantizer: fastoctree
