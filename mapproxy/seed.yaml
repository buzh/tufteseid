# Run by hand, never on a schedule:
#
#   docker compose exec mapproxy mapproxy-seed -c 4 \
#     -f /mapproxy/config/mapproxy.yaml -s /mapproxy/config/seed.yaml \
#     --seed ALL
#
# No `refresh_before` anywhere: MBTiles stores no per-tile timestamp, so any
# refresh time rebuilds every tile in the task rather than the stale ones.

coverages:
  lidar:
    bbox: [-100275, 6399725, 1150255, 8000275]
    srs: 'EPSG:25833'
  topo:
    bbox: [-127998, 6377920, 1145510, 7976800]
    srs: 'EPSG:25833'
  flyfoto:
    bbox: [-250025, 6299985, 1211155, 8985010]
    srs: 'EPSG:25833'

seeds:
  relief:
    caches: [lidar-dtm, lidar-dom]
    grids: [tufteseid25833]
    coverages: [lidar]
    levels:
      from: 0
      to: 9

  overlay:
    caches: [topo-ref, topo-ref-contours, amtskart]
    grids: [tufteseid25833]
    coverages: [topo]
    levels:
      from: 0
      to: 9

  ortofoto:
    caches: [flyfoto]
    grids: [tufteseid25833]
    coverages: [flyfoto]
    levels:
      from: 0
      to: 9
